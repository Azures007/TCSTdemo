dataset:
  name: hyrank
  source_name: Dioni
  target_name: Loukia
  source_image: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/HyRANK/Dioni.mat
  source_gt: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/HyRANK/Dioni_12gt.mat
  target_image: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/HyRANK/Loukia.mat
  target_gt: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/HyRANK/Loukia_12gt.mat
  num_classes: 12
  expected_bands:
    source: null
    target: null
  band_stride_source: 1
training:
  patch_size: 13
  batch_size: 8
  source_train_ratio: 0.05
  constraint_per_class: 12
  calibration_per_class: 12
  epochs_warmup: 40
  epochs_per_cycle: 6
  num_cycles: 8
  lr: 0.0002
  weight_decay: 0.0004
  num_workers: 4
  amp: true
  target_pool_size: 4000
  lr_scheduler: cosine
tcst:
  K: 12
  rho_a: 0.1
  rho_b: 0.1
  rho_m: 0.05
  lambda_d: 0.01
  lambda_xi: 50.0
  lambda_safe: 1.0
  per_class_constraint_samples: 12
  top_competitors: 2
  eta_candidates:
  - 1.0
  - 0.5
  - 0.25
  - 0.125
  - 0.0625
  - 0.03125
  tau_sem: 0.3
  tau_flip: 0.05
  tau_class_flip: 0.15
  tau_swd_min_drop: 1.0e-05
  use_rs_crw: true
  rs_crw_alpha: 1.5
  rs_crw_min_cal_samples: 5
  rs_crw_ema: 0.5
output:
  save_dir: /root/autodl-tmp/TCSTdemo/results/hyrank_5pct_diffparams
  seed: 1237
