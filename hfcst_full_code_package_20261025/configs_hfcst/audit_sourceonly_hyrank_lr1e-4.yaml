dataset:
  name: hyrank_dioni_to_loukia
  source_name: Dioni
  target_name: Loukia
  source_image: ${DATA_ROOT}/HyRANK/Dioni.mat
  source_gt: ${DATA_ROOT}/HyRANK/Dioni_12gt.mat
  target_image: ${DATA_ROOT}/HyRANK/Loukia.mat
  target_gt: ${DATA_ROOT}/HyRANK/Loukia_12gt.mat
  num_classes: 12
  expected_bands:
    source: null
    target: null
  band_mapping: null
training:
  seed: 1237
  patch_size: 13
  spatial_grid_size: 8
  batch_size: 32
  epochs_warmup: 80
  epochs_per_cycle: 1
  lr: 0.0001
  weight_decay: 0.0004
  lr_scheduler: cosine
  feature_dim: 64
  max_gate: 0.5
  label_smoothing: 0.03
  lambda_context: 0.5
  lambda_spectral: 0.5
  ema_decay: 0.99
  grad_clip: 5.0
  scale_quantile: 0.95
  per_class_train_cap: 150
  per_class_constraint_cap: 12
  per_class_calibration_cap: 80
  per_class_validation_cap: 150
  target_estimate_ratio: 0.7
  target_pool_size: 512
  target_validation_pool_size: 384
  lambda_transport: 0.1
  class_balanced_sampling: true
  block_split_overrides:
  - block: 15
    from: constraint
    to: train
  - block: 38
    from: train
    to: constraint
  strict_source_class_coverage: true
hfcst:
  K: 8
  rho_a: 0.1
  rho_b: 0.1
  rho_m: 0.05
  lambda_d: 0.01
  lambda_spec: 1.0
  lambda_feat: 1.0
  lambda_residual: 0.01
  min_effective_target_n: 8.0
  min_source_per_class: 4
  transport_source_per_class: 24
  per_class_constraint_samples: 12
  stable_fraction: 0.25
  shared_trust_radius: 0.03
  residual_trust_radius: 0.01
  min_direction_norm: 1.0e-07
  enable_class_residuals: false
  num_cycles: 0
  epochs_per_cycle: 1
  eta_candidates:
  - 1.0
  - 0.5
  - 0.25
  - 0.125
  - 0.0625
  teacher_temperature: 1.0
  spectral_perturb_std: 0.01
  bootstrap_replicates: 200
  bootstrap_confidence: 0.9
  minimum_bootstrap_replicates: 5
  minimum_transport_improvement: 1.0e-05
  minimum_relative_improvement: 0.0001
  max_new_error_rate: 0.02
  max_class_new_error_rate: 0.1
  max_margin_loss: 0.2
  margin_tolerance: 0.05
  max_target_pseudo_flip_rate: 0.25
  min_block_view_agreement: 0.4
  max_block_target_flip_rate: 0.35
  gain_max_deviation: 0.15
  offset_max_abs: 0.15
  gain_tv_max: 0.36
  offset_tv_max: 0.18
  relative_change_max: 0.15
  post_transport_tolerance: 0.02
output:
  seed: 1237
  save_dir: results_hfcst/audit_sourceonly_hyrank_lr1e-4_s1237
