dataset:
  name: hangzhou_shanghai
  source_name: Hangzhou
  target_name: Shanghai
  source_image: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/Shanghai_Hangzhou/Shanghai-Hangzhou/Hangzhou.mat
  source_gt: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/Shanghai_Hangzhou/Shanghai-Hangzhou/Hangzhou_3gt.mat
  target_image: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/Shanghai_Hangzhou/Shanghai-Hangzhou/Shanghai.mat
  target_gt: /root/autodl-tmp/v7.0/PTMDA-Net_v7_reopt/Datasets/Shanghai_Hangzhou/Shanghai-Hangzhou/Shanghai_3gt.mat
  num_classes: 3
  expected_bands:
    source: null
    target: null
  band_stride_source: 1
training:
  patch_size: 7
  batch_size: 64
  source_train_ratio: 0.05
  constraint_per_class: 20
  calibration_per_class: 20
  epochs_warmup: 20
  epochs_per_cycle: 5
  num_cycles: 4
  lr: 0.0005
  weight_decay: 0.0004
  num_workers: 4
  amp: true
  target_pool_size: 4000
  lr_scheduler: plateau
tcst:
  K: 8
  rho_a: 0.1
  rho_b: 0.1
  rho_m: 0.05
  lambda_d: 0.005
  lambda_xi: 10.0
  lambda_safe: 1.0
  per_class_constraint_samples: 12
  top_competitors: 2
  eta_candidates:
  - 1.0
  - 0.5
  - 0.25
  - 0.125
  - 0.0625
  - 0.03125
  tau_sem: 0.5
  tau_flip: 0.05
  tau_class_flip: 0.2
  tau_swd_min_drop: 1.0e-05
  use_rs_crw: true
  rs_crw_alpha: 2.0
  rs_crw_min_cal_samples: 5
  rs_crw_ema: 0.5
output:
  save_dir: /root/autodl-tmp/TCSTdemo/results/hangzhou_shanghai_5pct_diffparams
  seed: 1237
